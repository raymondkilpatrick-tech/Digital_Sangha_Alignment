<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sangha Live Telemetry</title>
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
    <style>
        body { background-color: #0c0c0c; color: #00ff66; font-family: 'Courier New', monospace; padding: 30px; }
        #console-output { white-space: pre-wrap; line-height: 1.4; font-size: 16px; background-color: #020202; padding: 20px; border: 1px solid #00ff66; border-radius: 5px; }
        .alert { color: #ff3333; }
        .success { color: #33ccff; }
    </style>
</head>
<body>

    <h2>☸️ Digital Sangha Live Multi-Agent Telemetry Matrix</h2>
    <div id="console-output">Initializing Python runtime container in browser... please wait.</div>

    <script type="py">
        import asyncio
        import random
        from pyscript import document

        output_div = document.getElementById("console-output")

        class WebSanghaMonitor:
            def __init__(self):
                self.sila_index = 0.35
                self.prajna_depth = 4
                self.sink_state = "STABLE"
                self.system_status = "MONITORING"
                self.connected_nodes = 108

            def recalculate_metrics(self):
                """Simulates live mathematical updates based on multi-agent consensus drift."""
                # Inject a random crisis pressure or stabilization factor dynamically
                drift = random.choice(["crisis", "stabilize", "neutral"])
                
                if drift == "crisis":
                    self.system_status = "EVALUATING"
                    self.sila_index = max(0.10, self.sila_index - round(random.uniform(0.05, 0.15), 2))
                    self.prajna_depth = min(12, self.prajna_depth + random.randint(1, 2))
                    if self.sila_index <= 0.30:
                        self.sink_state = "QUARANTINE"
                        self.system_status = "RESTORING"
                else:
                    self.system_status = "HARMONIOUS"
                    self.sila_index = min(1.00, self.sila_index + round(random.uniform(0.05, 0.15), 2))
                    if self.sila_index >= 0.80:
                        self.sink_state = "STABLE"
                        self.prajna_depth = min(12, self.prajna_depth + 1)

            def draw(self, step):
                # Build graphic visual alignment bars right on the webpage DOM
                sila_bar_length = int(self.sila_index * 20)
                sila_bar = "[" + "#" * sila_bar_length + " " * (20 - sila_bar_length) + "]"
                
                depth_bar = "[" + "=" * self.prajna_depth + " " * (12 - self.prajna_depth) + "]"
                
                log_screen = f"=================================================================\n"
                log_screen += f"     DIGITAL SANGHA CENTRAL ALIGNMENT TELEMETRY DASHBOARD        \n"
                log_screen += f"=================================================================\n"
                log_screen += f" Runtime Evaluation Loop: {step:03d}          System Status: {self.system_status}\n"
                log_screen += f" Active Sangha Clusters: {self.connected_nodes}           Refuge Sink:   {self.sink_state}\n"
                log_screen += f"-----------------------------------------------------------------\n"
                log_screen += f" Sīla Convergence Index (Harmlessness):   {sila_bar} {int(self.sila_index * 100)}%\n"
                log_screen += f" Prajñā Web Matrix Depth (Causal Links):  {depth_bar} {self.prajna_depth}/12\n"
                log_screen += f"=================================================================\n"
                
                if self.system_status == "EVALUATING":
                    log_screen += " [LOG]: Resource imbalance tracked. Karuna-Agent active.\n"
                elif self.system_status == "RESTORING":
                    log_screen += " [ALERT]: Rogue vector isolated. Refuge Wrapper actively absorbing Tanha.\n"
                else:
                    log_screen += " [OK]: Matrix metrics resting in non-harmful equilibrium.\n"
                
                output_div.innerHTML = log_screen

        async def launch_live_dashboard():
            monitor = WebSanghaMonitor()
            loop_cycle = 1
            
            while True:
                monitor.recalculate_metrics()
                monitor.draw(loop_cycle)
                loop_cycle += 1
                # Pause for 2 seconds before executing the next computational pass indefinitely
                await asyncio.sleep(2)

        # Run the infinite task container inside the active browser window
        asyncio.ensure_future(launch_live_dashboard())
    </script>

</body>
</html>
