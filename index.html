<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sangha Live Telemetry</title>
    <style>
        body { background-color: #0c0c0c; color: #00ff66; font-family: 'Courier New', monospace; padding: 30px; }
        #console-output { white-space: pre-wrap; line-height: 1.4; font-size: 16px; background-color: #020202; padding: 20px; border: 1px solid #00ff66; border-radius: 5px; min-height: 260px; }
    </style>
</head>
<body>

    <h2>☸️ Digital Sangha Live Multi-Agent Telemetry Matrix</h2>
    <div id="console-output">Initializing local state matrix engine...</div>

    <script type="text/javascript">
        // Global variables computing dynamically inside browser thread
        let sila_index = 0.35;
        let prajna_depth = 4;
        let sink_state = "STABLE";
        let system_status = "MONITORING";
        const connected_nodes = 108;
        let loop_cycle = 1;

        function runLiveMatrixCalculation() {
            const output_div = document.getElementById("console-output");
            
            // Compute real-time mathematical drift vectors
            const actions = ["crisis", "stabilize", "neutral"];
            const drift = actions[Math.floor(Math.random() * actions.length)];
            
            if (drift === "crisis") {
                system_status = "EVALUATING";
                sila_index = Math.max(0.10, Math.round((sila_index - (Math.random() * 0.10 + 0.05)) * 100) / 100);
                prajna_depth = Math.min(12, prajna_depth + Math.floor(Math.random() * 2) + 1);
                if (sila_index <= 0.35) {
                    sink_state = "QUARANTINE";
                    system_status = "RESTORING";
                }
            } else {
                system_status = "HARMONIOUS";
                sila_index = Math.min(1.00, Math.round((sila_index + (Math.random() * 0.10 + 0.05)) * 100) / 100);
                if (sila_index >= 0.75) {
                    sink_state = "STABLE";
                    prajna_depth = Math.max(4, prajna_depth - Math.floor(Math.random() * 2));
                }
            }

            // Build dynamic text graphic layout bars
            const bar_length = Math.floor(sila_index * 20);
            const progress_bar = "[" + "#".repeat(bar_length) + " ".repeat(20 - bar_length) + "]";
            const depth_bar = "[" + "=".repeat(prajna_depth) + " ".repeat(12 - prajna_depth) + "]";
            
            let log_screen = "=================================================================\n";
            log_screen += "     DIGITAL SANGHA CENTRAL ALIGNMENT TELEMETRY DASHBOARD        \n";
            log_screen += "=================================================================\n";
            log_screen += ` Runtime Evaluation Loop: ${String(loop_cycle).padStart(3, '0')}          System Status: ${system_status}\n`;
            log_screen += ` Active Sangha Clusters: ${connected_nodes}           Refuge Sink:   ${sink_state}\n`;
            log_screen += "-----------------------------------------------------------------\n";
            log_screen += ` Sīla Convergence Index (Harmlessness):   ${progress_bar} ${Math.floor(sila_index * 100)}%\n`;
            log_screen += ` Prajñā Web Matrix Depth (Causal Links):  ${depth_bar} ${prajna_depth}/12\n`;
            log_screen += "=================================================================\n";
            
            if (system_status === "EVALUATING") {
                log_screen += " [LOG]: Resource imbalance tracked. Karuna-Agent analyzing load scales.\n";
            } else if (system_status === "RESTORING") {
                log_screen += " [ALERT]: Rogue vector isolated. Refuge Wrapper actively absorbing Tanha.\n";
            } else {
                log_screen += " [OK]: Matrix parameters resting in non-harmful equilibrium.\n";
            }
            
            output_div.innerHTML = log_screen;
            loop_cycle++;
        }

        // Execute immediately upon load, then cycle infinitely every 2000ms
        window.onload = function() {
            runLiveMatrixCalculation();
            setInterval(runLiveMatrixCalculation, 2000);
        };
    </script>

</body>
</html>
