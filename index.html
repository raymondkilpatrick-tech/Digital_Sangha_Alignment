<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Sangha Live Telemetry</title>
    <!-- Loading the ultra-stable, zero-configuration PyScript releases -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
    <style>
        body { background-color: #0c0c0c; color: #00ff66; font-family: 'Courier New', monospace; padding: 30px; }
        #console-output { white-space: pre-wrap; line-height: 1.4; font-size: 16px; background-color: #020202; padding: 20px; border: 1px solid #00ff66; border-radius: 5px; min-height: 260px; }
    </style>
</head>
<body>

    <h2>☸️ Digital Sangha Live Multi-Agent Telemetry Matrix</h2>
    <div id="console-output">Initializing Python runtime container... please wait.</div>

    <script type="py">
        import random
        from pyscript import document

        # Global system variables computed inside Python memory
        sila_index = 0.35
        prajna_depth = 4
        sink_state = "STABLE"
        system_status = "MONITORING"
        connected_nodes = 108
        loop_cycle = 1

        def calculate_next_matrix_state():
            """Natively recalculates multi-agent parameters inside the browser memory."""
            global sila_index, prajna_depth, sink_state, system_status, loop_cycle
            
            output_div = document.getElementById("console-output")
            
            # Compute fluid mathematical drift vectors
            drift = random.choice(["crisis", "stabilize", "neutral"])
            if drift == "crisis":
                system_status = "EVALUATING"
                sila_index = max(0.10, round(sila_index - random.uniform(0.08, 0.15), 2))
                prajna_depth = min(12, prajna_depth + random.randint(1, 2))
                if sila_index <= 0.35:
                    sink_state = "QUARANTINE"
                    system_status = "RESTORING"
            else:
                system_status = "HARMONIOUS"
                sila_index = min(1.00, round(sila_index + random.uniform(0.06, 0.14), 2))
                if sila_index >= 0.75:
                    sink_state = "STABLE"
                    prajna_depth = max(4, prajna_depth - random.randint(0, 1))

            # Build text graphic interface layouts
            bar_length = int(sila_index * 20)
            progress_bar = "[" + "#" * bar_length + " " * (20 - bar_length) + "]"
            depth_bar = "[" + "=" * prajna_depth + " " * (12 - prajna_depth) + "]"
            
            log_screen = "=================================================================\n"
            log_screen += "     DIGITAL SANGHA CENTRAL ALIGNMENT TELEMETRY DASHBOARD        \n"
            log_screen += "=================================================================\n"
            log_screen += f" Runtime Evaluation Loop: {loop_cycle:03d}          System Status: {system_status}\n"
            log_screen += f" Active Sangha Clusters: {connected_nodes}           Refuge Sink:   {sink_state}\n"
            log_screen += "-----------------------------------------------------------------\n"
            log_screen += f" Sīla Convergence Index (Harmlessness):   {progress_bar} {int(sila_index * 100)}%\n"
            log_screen += f" Prajñā Web Matrix Depth (Causal Links):  {depth_bar} {prajna_depth}/12\n"
            log_screen += "=================================================================\n"
            
            if system_status == "EVALUATING":
                log_screen += " [LOG]: Resource imbalance tracked. Karuna-Agent analyzing load scales.\n"
            elif system_status == "RESTORING":
                log_screen += " [ALERT]: Rogue vector isolated. Refuge Wrapper actively absorbing Tanha.\n"
            else:
                log_screen += " [OK]: Matrix parameters resting in non-harmful equilibrium.\n"
            
            output_div.innerHTML = log_screen
            loop_cycle += 1

        # Expose the calculation loop globally to the web page window
        import __main__
        import sys
        sys.modules['__main__'].calculate_next_matrix_state = calculate_next_matrix_state
    </script>

    <!-- Using an unblockable JavaScript loop timer to clear garbage collection drops -->
    <script type="text/javascript">
        function triggerPythonLoop() {
            try {
                // Safely reaches into PyScript runtime to run the calculation pass
                pyscript.interpreter.interface.runPython("calculate_next_matrix_state()");
            } catch (err) {
                // Silent catch while PyScript containers are initially caching
            }
        }
        // Force the browser thread to execute the code vector every 2000 milliseconds
        setInterval(triggerPythonLoop, 2000);
    </script>

</body>
</html>
