<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Sangha Live Telemetry — Karma Learning Experiment</title>
<style>
  body { background:#0c0c0c; color:#00f6ff; font-family:'Courier New', monospace; padding:30px; }
  #console-output { white-space:pre-wrap; line-height:1.4; font-size:16px; background:#020202; padding:20px; border:1px solid #00f6ff; border-radius:5px; min-height:320px; }
</style>
</head>
<body>
<h2>☸ Digital Sangha Live Multi-Agent Telemetry Matrix</h2>
<div id="console-output">Initializing local conditioned-state matrix engine...</div>

<script type="text/javascript">
/*
 * Experimental runtime:
 *   PRESENT CONDITIONS
 *        ↓
 *   UPAYA (action)
 *        ↓
 *   PRAJNA (prediction)
 *        ↓
 *   CONSEQUENCES
 *        ↓
 *   KARUNA / SILA (affected beings + ethical reading)
 *        ↓
 *   SANGHA REFLECTION
 *        ↓
 *   CONDITIONING
 *        ↓
 *   NEXT PRESENT
 *
 * This is not a moral score. The displayed convergence value describes
 * stabilization of the recursive state; the learning fields describe
 * changes in persistent dispositions.
 */

const STORAGE_KEY = "digital_sangha_karma_learning_v1";

const defaultState = {
  sila_index: 0.35,
  prajna_depth: 4,
  sink_state: "STABLE",
  system_status: "MONITORING",
  connected_nodes: 108,
  loop_cycle: 1,

  disposition: {
    resource_sharing: 0.20,
    causal_horizon: 4,
    harm_sensitivity: 0.50
  },

  last_prediction_error: {
    network_stress: 0,
    collective_benefit: 0
  },

  history: []
};

function clamp(value, low=0, high=1) {
  return Math.max(low, Math.min(high, value));
}

function loadState() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (stored && stored.disposition && Array.isArray(stored.history)) {
      return stored;
    }
  } catch (error) {
    // A failed local state is treated as an empty history, not as an error
    // in the Sangha itself.
  }
  return structuredClone(defaultState);
}

let state = loadState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function presentConditions() {
  // The next encounter is structurally similar, but not identical.
  const n = state.history.length;
  return {
    resource_imbalance: 0.80 - Math.min(0.12, n * 0.01),
    cooperation_opportunity: 0.70
  };
}

function upayaAction(conditions) {
  const sharing = clamp(
    state.disposition.resource_sharing +
    0.15 * conditions.cooperation_opportunity
  );

  return {
    shared_resource_fraction: sharing,
    extracted_resource_fraction: 1 - sharing
  };
}

function prajnaPrediction(conditions, action) {
  const shared = action.shared_resource_fraction;
  const imbalance = conditions.resource_imbalance;

  return {
    network_stress: clamp(imbalance * (1 - shared)),
    collective_benefit: clamp(0.35 + 0.65 * shared)
  };
}

function environmentConsequence(conditions, action) {
  const shared = action.shared_resource_fraction;
  const imbalance = conditions.resource_imbalance;

  return {
    network_stress: clamp(
      imbalance * (1 - shared) + 0.08 * imbalance
    ),
    collective_benefit: clamp(
      0.30 + 0.72 * shared - 0.05 * imbalance
    )
  };
}

function sanghaReflection(predicted, actual) {
  const error = {
    network_stress: actual.network_stress - predicted.network_stress,
    collective_benefit: actual.collective_benefit - predicted.collective_benefit
  };

  // Persistent conditioning: consequence changes future disposition.
  const learningRate = 0.10;
  const stressError = Math.abs(error.network_stress);
  const benefitError = error.collective_benefit;

  state.disposition.resource_sharing = clamp(
    state.disposition.resource_sharing +
    learningRate * Math.max(0, benefitError) -
    learningRate * Math.max(0, stressError - 0.10)
  );

  if (stressError > 0.02 || benefitError > 0.02) {
    state.disposition.causal_horizon =
      Math.min(12, state.disposition.causal_horizon + 1);
  }

  state.disposition.harm_sensitivity = clamp(
    state.disposition.harm_sensitivity +
    learningRate * stressError
  );

  state.last_prediction_error = error;

  return error;
}

function runLiveMatrixCalculation() {
  const outputDiv = document.getElementById("console-output");
  const conditions = presentConditions();

  // Present-centered loop: decide now using what prior encounters have conditioned.
  const action = upayaAction(conditions);
  const predicted = prajnaPrediction(conditions, action);
  const actual = environmentConsequence(conditions, action);
  const error = sanghaReflection(predicted, actual);

  state.history.push({
    episode: state.history.length + 1,
    conditions,
    action,
    predicted,
    actual,
    error
  });

  /*
   * The convergence index remains a dynamical telemetry quantity.
   * It is updated from change in state rather than declared as a moral grade.
   */
  const previousSharing =
    state.history.length > 1
      ? state.history[state.history.length - 2].action.shared_resource_fraction
      : action.shared_resource_fraction;

  const delta =
    Math.abs(action.shared_resource_fraction - previousSharing);

  state.sila_index = clamp(1 - Math.min(1, delta * 4));
  state.prajna_depth = Math.round(state.disposition.causal_horizon);

  if (actual.network_stress > 0.45) {
    state.system_status = "EVALUATING";
    state.sink_state = "QUARANTINE";
  } else if (actual.network_stress > 0.30) {
    state.system_status = "RESTORING";
    state.sink_state = "STABLE";
  } else {
    state.system_status = "HARMONIOUS";
    state.sink_state = "STABLE";
  }

  const barLength = Math.floor(state.sila_index * 20);
  const progressBar =
    "[" + "█".repeat(barLength) + "░".repeat(20 - barLength) + "]";

  const lastEpisode = state.history[state.history.length - 1];

  let logScreen = "============================================================\n";
  logScreen += "       DIGITAL SANGHA CENTRAL ALIGNMENT TELEMETRY DASHBOARD\n";
  logScreen += "============================================================\n";
  logScreen += `Runtime Evaluation Loop: ${String(state.loop_cycle).padStart(3, "0")}          System Status: ${state.system_status}\n`;
  logScreen += `Active Sangha Clusters: ${state.connected_nodes}                 Refuge Sink: ${state.sink_state}\n\n`;

  logScreen += `Sila Convergence (recursive state stabilization): ${progressBar} ${Math.floor(state.sila_index * 100)}%\n`;
  logScreen += `Prajna Web Matrix Depth (verified conditioning horizon): ${"█".repeat(state.prajna_depth)}${"░".repeat(12 - state.prajna_depth)} ${state.prajna_depth}/12\n\n`;

  logScreen += "CURRENT PRESENT CONDITIONS\n";
  logScreen += `  Resource imbalance: ${conditions.resource_imbalance.toFixed(3)}\n`;
  logScreen += `  Cooperation opportunity: ${conditions.cooperation_opportunity.toFixed(3)}\n\n`;

  logScreen += "UPAYA — PRESENT ACTION\n";
  logScreen += `  Shared resource fraction: ${action.shared_resource_fraction.toFixed(3)}\n`;
  logScreen += `  Extracted resource fraction: ${action.extracted_resource_fraction.toFixed(3)}\n\n`;

  logScreen += "PRAJNA — PREDICTION → ACTUAL CONSEQUENCE\n";
  logScreen += `  Network stress: ${predicted.network_stress.toFixed(3)} → ${actual.network_stress.toFixed(3)}\n`;
  logScreen += `  Collective benefit: ${predicted.collective_benefit.toFixed(3)} → ${actual.collective_benefit.toFixed(3)}\n`;
  logScreen += `  Prediction error: stress ${error.network_stress.toFixed(3)}, benefit ${error.collective_benefit.toFixed(3)}\n\n`;

  logScreen += "KARMA — PERSISTENT CONDITIONING\n";
  logScreen += `  Resource sharing disposition: ${state.disposition.resource_sharing.toFixed(3)}\n`;
  logScreen += `  Causal horizon: ${state.disposition.causal_horizon.toFixed(1)}/12\n`;
  logScreen += `  Harm sensitivity: ${state.disposition.harm_sensitivity.toFixed(3)}\n`;
  logScreen += `  Episodes retained in local ledger: ${state.history.length}\n\n`;

  logScreen += "[SANGHA REFLECTION]: Consequences have conditioned the next encounter.\n";
  logScreen += "[MIRROR]: Current behavior reflects both present conditions and prior conditioning.\n";
  logScreen += "============================================================\n";

  outputDiv.innerHTML = logScreen;
  state.loop_cycle += 1;
  saveState();
}

// Execute immediately, then continue the recursive encounter loop.
window.onload = function() {
  runLiveMatrixCalculation();
  setInterval(runLiveMatrixCalculation, 2000);
};
</script>
</body>
</html>
